services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: day6_lab
      POSTGRES_USER: day6
      POSTGRES_PASSWORD: day6_local_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day6 -d day6_lab"]
      interval: 3s
      timeout: 3s
      retries: 30
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_embedding
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  pg_data:
    external: true
    name: day6_student_starter_pg_data
  ollama_data:
    external: true
    name: day6_student_starter_ollama_data